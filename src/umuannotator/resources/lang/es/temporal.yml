language: es

bad_exact_surfaces:
  - SEP

bad_starts:
  - a
  - en
  - de
  - del
  - por
  - para
  - con
  - sin

bad_single_words:
  - una
  - un
  - uno
  - unos
  - unas
  - ya
  - ahora
  - primero
  - mar

bad_prepositional_time_starts:
  - a

bad_prepositional_time_words:
  - una
  - un
  - uno
  - dos
  - tres
  - cuatro
  - cinco
  - seis
  - siete
  - ocho
  - nueve
  - diez
  - once
  - doce

bad_year_surfaces:
  - mil
  - "1.000"
  - "1000"
  - "2.000"

bad_prefixes_by_grain:
  minute:
    - "un "

person_name_month_words:
  - julio

clock_time_only_patterns:
  - '^\d{1,2}:\d{2}$'
  - '^a las \d{1,2}:\d{2}$'
  - '^a la \d{1,2}:\d{2}$'

weekdays:
  lunes: 0
  martes: 1
  miércoles: 2
  jueves: 3
  viernes: 4
  sábado: 5
  domingo: 6

duration_units:
  segundo:
    unit: second
    seconds: 1

  minuto:
    unit: minute
    seconds: 60

  hora:
    unit: hour
    seconds: 3600

  día:
    unit: day
    seconds: 86400

  semana:
    unit: week
    seconds: 604800